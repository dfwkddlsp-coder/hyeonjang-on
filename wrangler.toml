name = "hyeonjang-on"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "hyeonjang-on-db"
database_id = "LOCAL-ONLY"
migrations_dir = "migrations"

[observability]
enabled = true
