name = "hyeonjang-on"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "hyeonjang-on-db"
database_id = "d162e0f7-aeb4-48f3-8fec-06616d22c6cc"
migrations_dir = "migrations"

# 사진·서명 저장소 (비공개). 연결되면 새 사진은 여기로, 예전 사진은 설정→데이터·앱에서 옮김
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "hyeonjang-on-photos"

[observability]
enabled = true
