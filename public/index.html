<style>
/* 한글은 모두 Pretendard 한 글꼴로 통일 (영문·숫자는 Chiron GoRound TC) */
@font-face{font-family:"HyeonjangKR";src:url("vendor/fonts/PretendardVariable.woff2") format("woff2-variations"),url("vendor/fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-style:normal;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF}
:root{
  --bg:#f4f2ee;--card:#fff;--ink:#1c1c1a;--sub:#6e6b64;--line:#e3dfd7;--pri:#1c1c1a;--pri2:#55524c;
  --ok:#2e7d4f;--warn:#a86a12;--bad:#b4362a;--l1:#f2c230;--l2:#e9853a;--l3:#c8402f;--chip:#ece9e2;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "HyeonjangKR","Chiron GoRound TC","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top .brand{font-weight:800;font-size:18px;white-space:nowrap}
.top small{font-weight:500;opacity:.8;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp{flex:1}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav#nav{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 8px;width:96px;flex:none;position:sticky;top:52px;height:calc(100vh - 52px)}
nav#nav button{border:0;background:none;border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--sub);cursor:pointer}
nav#nav button .ni{display:flex;align-items:center;justify-content:center;height:26px}
nav#nav button .ni .i{width:24px;height:24px}
nav#nav button.on{background:var(--chip);color:var(--ink);font-weight:700}
main{flex:1;min-width:0;padding:16px;padding-bottom:96px;max-width:1200px}
@media (max-width:760px){
  nav#nav{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;width:auto;flex-direction:row;justify-content:space-around;gap:0;border-right:0;border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
  nav#nav button{flex:1;min-width:0;padding:8px 0 6px;font-size:11px;letter-spacing:-.04em;white-space:nowrap;gap:3px;border-radius:10px}
  nav#nav button .ni .i{width:22px;height:22px}
  main{padding:12px 12px calc(104px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(112px + env(safe-area-inset-bottom))}
}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:18px;margin:18px 0 10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:180px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--pri);color:#fff;font-weight:700;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--chip);color:var(--pri)}
.btn.line{background:#fff;color:var(--pri);border:1.5px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.xl{min-height:72px;font-size:20px;border-radius:16px;width:100%}
.btn:disabled{opacity:.45}
label.f{display:block;font-size:13px;color:var(--sub);font-weight:600;margin:10px 0 4px}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;min-height:48px}
.inp:focus{outline:2px solid var(--pri2);border-color:transparent}
.inp.big{font-size:20px;padding:14px}
textarea.inp{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;font-size:15px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.muted{color:var(--sub)}
.small{font-size:13px}
.stat{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.stat .n{font-size:30px;font-weight:800;line-height:1.1}
.stat .t{font-size:13px;color:var(--sub);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--chip);color:var(--pri);white-space:nowrap}
.b1{background:#fff3c2;color:#7a5d00}.b2{background:#ffe1c7;color:#8a4300}.b3{background:#ffd5d7;color:#a0141b}
.bok{background:#d8f2e2;color:#14653a}.bwarn{background:#fff0cc;color:#8a5a00}.bbad{background:#ffd5d7;color:#a0141b}.bgray{background:#eceff3;color:#5b6878}
.list .it{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .m{flex:1;min-width:0}
.list .it .m b{font-size:16px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
.d1{background:var(--l1);color:#5a4500}.d2{background:var(--l2)}.d3{background:var(--l3)}.d0{background:#c3cbd6}
.pick-res{margin-top:6px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pick-res:empty{display:none}
.pick-res button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px;cursor:pointer}
.pick-res button:last-child{border-bottom:0}
.pick-res button:active{background:var(--chip)}
.who{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;background:var(--chip)}
.who .nm{font-size:22px;font-weight:800}
.sig{border:1.5px dashed #9aa7b7;border-radius:12px;background:#fff;overflow:hidden}
.sig-h{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#f7f9fb;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.sig canvas{display:block;width:100%;height:170px;touch-action:none;background:#fff}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:#ddd}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.sticker{width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;box-shadow:inset 0 0 0 6px rgba(255,255,255,.55);text-align:center;flex:none}
.sticker .a{font-size:24px}.sticker .b{font-size:14px;font-weight:600}
.level-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;white-space:nowrap}
table.t th{background:#f1f4f8;font-size:13px;color:var(--sub);position:sticky;top:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f8fafc}
.exp-bad{color:var(--bad);font-weight:700}.exp-warn{color:var(--warn);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 16px 24px}
@media (min-width:761px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:14px 0;z-index:2;font-size:18px}
.x{border:0;background:var(--chip);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#16202c;color:#fff;padding:12px 18px;border-radius:12px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.empty{padding:28px;text-align:center;color:var(--sub)}
.judge{font-size:26px;font-weight:800;padding:10px 16px;border-radius:12px;text-align:center}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--sub);font-weight:600}.kv dd{margin:0;word-break:break-all}
.lock{position:fixed;inset:0;background:#1c1c1a;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff}
.lock input{font-size:28px;text-align:center;letter-spacing:10px;width:220px}
.hint{background:rgba(255,255,255,.62);padding:12px 14px;border-radius:12px;font-size:14px;color:#4c4942}
#print{display:none}
.auth-box{background:var(--card);color:var(--ink);width:min(380px,92vw);max-height:92vh;overflow:auto;border-radius:20px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.auth-err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.lock{overflow:auto}

/* 장비 일일점검 */
.eqc .row>.btn{flex:none}
.eqdays{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.eqd{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-height:58px}
.eqd span{font-size:11px;color:var(--sub);white-space:nowrap}.eqd b{font-size:18px;line-height:1.2;color:#b9b4aa}.eqd small{font-size:10px;color:var(--sub)}
.eqd.ok b{color:var(--ok)}.eqd.bad{border-color:var(--bad)}.eqd.bad b{color:var(--bad)}.eqd.today{border-color:var(--ink)}.eqd:disabled{opacity:.4;cursor:default}
.ecopt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ecopt button{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:46px;font-weight:700;color:var(--sub);cursor:pointer}
.ecopt button.on[data-v="O"]{background:var(--ok);border-color:var(--ok);color:#fff}.ecopt button.on[data-v="X"]{background:var(--bad);border-color:var(--bad);color:#fff}.ecopt button.on[data-v="N"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ecph{width:132px}.ecph .ph{width:132px;height:100px}.ecph .inp{min-height:36px;padding:6px 8px;font-size:13px;margin-top:4px}
/* 인쇄: 주간 점검표 · 사진대지 */
.doc.eqw .grid6 th,.doc.eqw .grid6 td{width:auto;text-align:center;font-size:10pt;padding:1.6mm 1mm}
.doc.eqw .grid6 .it{text-align:left;width:62mm}.doc.eqw .grid6 .rm{width:34mm;text-align:left;font-size:8.5pt}
.doc.eqw .dsc{font-size:8pt;color:#444;margin-top:.5mm}.doc.eqw .mk{font-size:13pt;width:12mm}.doc.eqw .mk.sm{font-size:8pt}
.doc.psheet h1{letter-spacing:6mm}.doc.psheet .pl{margin:0 0 3mm;font-size:11pt}
.doc .pblock{margin-bottom:5mm}.doc .pblock.empty{border:1px solid #000;height:120mm;display:flex;align-items:center;justify-content:center;font-size:12pt}
.doc .pgrid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #000;border-bottom:0}
.doc .pgrid>div{height:57mm;border-right:1px solid #000;border-bottom:1px solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.doc .pgrid>div:nth-child(2n){border-right:0}
.doc .pgrid img{max-width:100%;max-height:100%;object-fit:contain}
.doc .pgrid.n1{grid-template-columns:1fr}.doc .pgrid.n1>div{height:114mm;border-right:0}
.doc .pgrid.n2>div{height:114mm}
.doc .pblock table{margin:0;table-layout:fixed}.doc .pblock th{width:18mm}.doc .pblock td:nth-of-type(1){width:48mm}
/* 화면 안 하위 탭 */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px 0 14px;padding:4px;background:var(--chip);border-radius:14px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:10px;padding:9px 12px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dot .i{width:20px;height:20px}

/* --- smartphone --- */
.ph-only{display:none}
.top .brand{display:flex;align-items:center;gap:8px}
.top .logo{width:28px;height:28px;border-radius:7px;flex:none}
.hm-title{display:flex;align-items:center;gap:.22em}
.hm-logo{height:.92em;width:.92em;border-radius:.22em;flex:none;box-shadow:0 6px 14px -8px rgba(120,30,10,.6)}
.who>div{min-width:0}
.badge.wrap{white-space:normal;max-width:100%;line-height:1.35}
nav#nav{overflow-y:auto}
@media (max-width:600px){
  .ph-only{display:block}.pc-only{display:none!important}
  .top{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
  h1{font-size:20px;margin:2px 0 10px}
  h2{font-size:17px;margin:14px 0 8px}
  .card{padding:12px;border-radius:12px;margin-bottom:10px}
  .kv{grid-template-columns:84px 1fr;font-size:14px}
  .sheet{height:100dvh;max-height:100dvh;border-radius:0;padding:0 12px calc(20px + env(safe-area-inset-bottom))}
  .sheet-h{padding:10px 0;font-size:17px}
  .x{width:44px;height:44px}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-12px;margin-right:-12px;padding:0 12px 2px}
  .chips.scroll::-webkit-scrollbar{display:none}
  .chips.scroll .chip{flex:none}
  .row>.btn{flex:1 1 auto}
  .btn.xl{min-height:60px;font-size:18px}
  .stat{padding:10px 12px}.stat .n{font-size:24px}
  .who{padding:12px;gap:10px}.who .nm{font-size:19px}
  .sticker{width:96px;height:96px}.sticker .a{font-size:18px}.sticker .b{font-size:12px}
  .list .it{padding:10px 2px;gap:10px}
  .dot{width:38px;height:38px;font-size:12px}
  .judge{font-size:19px;padding:8px 12px}
  .inp.big{font-size:18px;padding:12px}
  .sig canvas{height:150px}
  .pick-res button{padding:12px 10px}
  .grid.g4{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat .t{font-size:11px}.stat .n{font-size:22px}.stat .small{font-size:11px}
  .list .it>.badge{font-size:11px;padding:3px 7px;max-width:76px;white-space:normal;text-align:center;line-height:1.25}
}

/* --- home (reference: beige paper, red accent, big lowercase heads) --- */
body.is-home{--paper:#efece6;--tile:#fff;--red:#1c1c1a;--ink2:#1c1c1a;background:var(--paper);min-height:100vh}
html:has(body.is-home){background:#efece6}
body.is-home nav#nav{display:none}
body.is-home main{max-width:1280px;margin:0 auto;padding-top:12px;padding-bottom:40px}
body.is-home .top{background:var(--paper);color:var(--ink2);box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
body.is-home #netBadge{background:rgba(0,0,0,.05)!important;color:var(--sub)!important}
.hm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
.hm-title{font-size:clamp(30px,5vw,48px);line-height:1;font-weight:900;color:var(--red);letter-spacing:-.03em;margin:0}
.hm-kicker{font-size:11px;letter-spacing:.08em;color:#6b675e;margin-bottom:6px}
.hm-motto{margin:8px 0 0;font-size:14px;font-weight:500;color:#5b574f;letter-spacing:-.01em}
.hm-site{font-size:12px;color:#6b675e;text-align:right;line-height:1.5;border-left:1px solid rgba(0,0,0,.18);padding-left:12px}
.hm-site b{color:var(--ink2);font-size:14px}
/* 한 화면에 6개: 휴대폰·세로 태블릿 2열x3행, 가로 태블릿·PC 3열x2행 */
/* 7개: 휴대폰·세로 태블릿 2열x4행, 가로 태블릿·PC 4열x2행 (1번 타일은 2칸) */
.hm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile.wide{grid-column:span 2}
@media (min-width:900px) and (orientation:landscape),(min-width:1100px){.hm-grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;overflow:hidden;border:0;text-align:left;cursor:pointer;background:var(--tile);border-radius:20px;padding:14px 16px;height:clamp(104px,calc((100dvh - 250px)/4),160px);
  box-shadow:0 1px 0 rgba(0,0,0,.05),0 8px 18px -12px rgba(60,40,20,.35);display:flex;flex-direction:column;justify-content:space-between;color:var(--ink2);transition:transform .15s,box-shadow .15s}
@media (min-width:900px) and (orientation:landscape),(min-width:1100px){.tile{height:clamp(130px,calc((100dvh - 210px)/2),190px)}}
.tile:active{transform:scale(.98)}
@media (hover:hover){.tile:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(0,0,0,.05),0 14px 24px -14px rgba(60,40,20,.45)}}
.tile .tic{position:absolute;right:16px;top:15px;color:#a19c91}.tile .tic .i{width:22px;height:22px}
.tile.dark .tic{color:#8e8a80}
.tile .no{color:#d6d1c6!important;position:absolute;right:14px;bottom:8px;font-size:clamp(34px,5vw,46px);font-weight:900;color:var(--red);line-height:1;letter-spacing:-.04em}
.tile .nm{font-size:clamp(22px,3.4vw,30px);font-weight:900;color:var(--red);line-height:1;letter-spacing:-.03em}
.tile .en{font-size:11px;letter-spacing:.05em;color:#7a766c;margin-top:4px}
.tile .side{position:absolute;right:12px;top:14px;writing-mode:vertical-rl;font-size:10px;letter-spacing:.1em;color:#9a958a;max-height:45%;overflow:hidden}
.tile .meta{display:flex;align-items:center;gap:8px;max-width:calc(100% - 52px)}

<div id="modal" class="modal hidden"><div class="sheet"><div class="sheet-h"><b id="mTitle"></b><button class="x" id="mClose" aria-label="닫기"><i class="i i-x"></i></button></div><div id="mBody"></div></div></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>h(s).replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=s=>String(s??'').toLowerCase().replace(/[\s\n\r()（）\-_.·]/g,'');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const nowLocal=()=>{const d=new Date();return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtDT=s=>s?s.replace('T',' '):'';
const hm=s=>s?s.slice(11,16):'';
const WD='일월화수목금토';
const dayLabel=ds=>{const d=new Date(ds+'T00:00');return `${pad(d.getMonth()+1)}/${pad(d.getDate())}(${WD[d.getDay()]})`};
const addDays=(ds,n)=>{const d=new Date(ds+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function parseDate(s){
  s=String(s??'').trim();if(!s)return null;let m;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){let y=+m[3];if(y<100)y+=2000;return new Date(y,m[1]-1,+m[2])}
  if((m=s.match(/(\d{2,4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/))){let y=+m[1];if(y<100)y+=2000;return new Date(y,m[2]-1,+m[3])}
  return null;
}
function expState(s){const d=parseDate(s);if(!d)return '';const diff=(d-new Date(today()+'T00:00'))/864e5;if(diff<0)return 'bad';if(diff<=30)return 'warn';return 'ok'}
function expCell(s){const st=expState(s);if(!s)return '';return `<span class="${st==='bad'?'exp-bad':st==='warn'?'exp-warn':''}">${h(s)}${st==='bad'?' (만료)':st==='warn'?' (임박)':''}</span>`}

/* ---------- storage ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('fieldsafety',4);
    r.onupgradeneeded=()=>{const d=r.result;['workers','equipment','violations','alcohol','vuln','eqchecks'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'k'});if(!d.objectStoreNames.contains('outbox'))d.createObjectStore('outbox',{keyPath:'k'})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  st(s,m){return this.db.transaction(s,m).objectStore(s)},
  all(s){return this.req(this.st(s,'readonly').getAll())},
  put(s,o){return this.req(this.st(s,'readwrite').put(o))},
  del(s,id){return this.req(this.st(s,'readwrite').delete(id))},
  putMany(s,arr,clear){return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');const o=t.objectStore(s);if(clear)o.clear();arr.forEach(x=>o.put(x));t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};
let W=[],E=[],V=[],A=[],VU=[],EC=[];
const STORE={workers:()=>W,equipment:()=>E,violations:()=>V,alcohol:()=>A,vuln:()=>VU,eqchecks:()=>EC};
function memPut(store,obj){const arr=STORE[store]();const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj)}
function memDel(store,id){const arr=STORE[store]();const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1)}
/* 서버 모드: 기기에 먼저 저장 → 전송 대기함(outbox) → 연결되면 서버로. 인터넷이 없어도 입력은 계속 됩니다 */
async function save(store,obj){await DB.put(store,obj);memPut(store,obj);if(SERVER){await DB.put('outbox',{k:store+'|'+obj.id,store,id:obj.id,data:obj,ts:Date.now()});Sync.soon()}}
async function remove(store,id){if(SERVER){if(!navigator.onLine){toast('삭제는 인터넷 연결이 필요합니다');throw new Error('offline')}await api('docs/delete',{store,id})}await DB.del(store,id);memDel(store,id)}

const DEF={
  site:'',inspectorOrg:'',inspector:'',periodMonths:0,pin:'',
  vtypes:['안전모 미착용 / 턱끈 미체결','안전대 미체결','지정 통로 외 이동','출입금지구역 무단 출입','개인보호구 미착용','신호수·유도자 없이 장비작업','작업절차 미준수','흡연구역 외 흡연','음주 후 출근·작업','기타'],
  levels:[
    {name:'1차 적발',sticker:'노란색',act:'위반 스티커 부착(노란색)\n근로자 관리대장 기록\n현장지도 및 교육'},
    {name:'2차 적발',sticker:'주황색',act:'위반 스티커 부착(주황색)\n근로자 관리대장 기록\n안전교육장에서 교육 진행(1시간)'},
    {name:'3차 적발',sticker:'적색',act:'작업중지\n해당 협력사 소장에게 퇴출 요청\n퇴출 조치'}
  ],
  vulnAge:55,bp:{warn:[140,90],stop:[160,100]},
  eqItems:'안전벨트 / 안전레버|좌석 안전벨트는 운행 중 상시 착용하고 안전레버 하강 시 조종이 불가할 것\n버켓 안전핀 / 훅해지장치|규정된 버켓을 사용하고 안전핀은 정상적으로 체결되어 있을 것, 훅해지장치가 있을 것\n조종장치 / 제동장치|브레이크, 클러치 및 조종장치는 손상 및 변형이 없으며 정상 작동될 것\n장비실명제 부착상태|장비실명제(허가증)가 부착되어 있고 해당 운전원이 실제 운전을 하고 있는지 확인\n협착방지봉 / 후방카메라·센서·후사경·경보기·조명|협착방지봉 부착상태, 후방카메라·센서·후사경·경보기·조명 정상작동 여부\n트랙 / 차륜|트랙 또는 차륜(타이어)의 균열·변형·파손 등 주행장치 이상이 없을 것 (손상이 심하면 타이어 교체 지시 및 확인)\n작업구역 통제|안전시설물 등으로 작업구역을 설정하고 유도자를 배치할 것 (장비 1대당 유도자 1명 이상)',
  alcMode:'site',
  alc:{retest:0.020,stop:0.050,detect:0.001,day:0.030,outCount:2},
  alcMsg:'음주적발 알림\n1. 협력사명 : {업체}\n2. 측정일시 : {일시}\n3. {성명}({직종})\n4. 혈중 알코올 농도 {수치}\n5. 조치 : 🚫{조치}\n\n기준 : \n{기준}\n\n해당인원이 현장에서 작업하지 않도록 각별한 관리 부탁드리며 작업 중 적발 시 영구 퇴출 등 불이익이 발생할 수 있으니 참고해주시기 바랍니다.\n\n모든 관리자께서는 해당인원이 현장에서 작업할 시 작업중지 및 안전보건팀에 연락해주시기 바랍니다.'
};
let S=JSON.parse(JSON.stringify(DEF));
async function loadSettings(){const r=await DB.req(DB.st('kv','readonly').get('settings'));if(r){S=Object.assign(JSON.parse(JSON.stringify(DEF)),r.v);S.alc=Object.assign({},DEF.alc,r.v.alc||{})}}
async function saveSettings(){await DB.put('kv',{k:'settings',v:S})}

/* ---------- domain ---------- */
const pkey=(name,company)=>norm(name)+'|'+norm(company);
function inPeriod(dateStr){if(!S.periodMonths)return true;const d=new Date();d.setMonth(d.getMonth()-S.periodMonths);return dateStr>=ymd(d)}
function strikesOf(key,excludeId){return V.filter(v=>!v.void&&v.pkey===key&&v.id!==excludeId&&inPeriod(v.date)).sort((a,b)=>a.at.localeCompare(b.at))}
function workerByKey(key){return W.find(w=>pkey(w.name,w.company)===key)}
function isBanned(key){const w=workerByKey(key);return (w&&w.banned)||V.some(v=>!v.void&&v.pkey===key&&v.level===3)||A.some(a=>!a.void&&a.pkey===key&&a.out)}
function judge(val,refused,isRetest){if(refused)return '측정거부';
  if(S.alcMode==='site'){if(val<S.alc.detect)return '정상';if(val<S.alc.day)return '오전 작업중지';return '당일 작업중지'}
  if(val>=S.alc.stop)return '작업금지';if(val>=S.alc.retest)return isRetest?'작업금지':'재측정';return '정상'}
const JUDGE_ACT={'정상':'작업 투입','재측정':'10분 후 재측정','작업금지':'당일 작업금지 및 귀가조치','측정거부':'출입통제 및 작업배제','오전 작업중지':'오전 작업 중지 (간단한 숙취)','당일 작업중지':'금일 작업금지, 위험성평가 회의 시 심의 예정'};
const judgeCls=j=>({'정상':'bok','재측정':'bwarn','작업금지':'bbad','측정거부':'bbad','오전 작업중지':'b2','당일 작업중지':'bbad'}[j]||'bgray');
const isAlcBad=a=>!!a.judge&&a.judge!=='정상'&&a.judge!=='재측정';
const f3=v=>(+v).toFixed(3);
function alcCriteria(){const a=S.alc;return S.alcMode==='site'
  ?[`${+a.day}% 미만 : 오전 작업 중지 (간단한 숙취)`,`${+a.day}~0.08%미만 : 당일 작업 중지, 심의`,`${a.outCount}회 적발 시 : 영구퇴출`]
  :[`${f3(a.retest)}% 미만 : 정상 작업`,`${f3(a.retest)}~${f3(a.stop-0.001)}% : 10분 후 재측정`,`${f3(a.stop)}% 이상 : 당일 작업금지 및 귀가조치`,'측정 거부 : 출입통제 및 작업배제']}
/* 이전 음주 적발 횟수 (재측정 묶음은 1회) */
function alcBadCount(key,excludeId){return A.filter(x=>x.pkey===key&&!x.void&&!x.retestOf&&x.id!==excludeId&&isAlcBad(alcFinal(x))).length}
function alcMessage(a){const d=a.at.slice(2,10).split('-');
  return S.alcMsg.replace(/\{업체\}/g,a.company).replace(/\{일시\}/g,`${d[0]}년 ${+d[1]}월 ${+d[2]}일 ${hm(a.at)}`).replace(/\{성명\}/g,a.name).replace(/\{직종\}/g,a.job||'-')
   .replace(/\{수치\}/g,a.refused?'측정 거부':f3(a.value)+'%').replace(/\{조치\}/g,a.action).replace(/\{기준\}/g,alcCriteria().map((c,i)=>`${i+1}. ${c}`).join('\n'))}
async function shareAlcMessage(a){const t=alcMessage(a);
  if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(t);toast('알림 문구 복사됨 — 카톡 등에 붙여넣기')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('알림 문구 복사됨')}}
function retestChild(a){return A.find(x=>x.retestOf===a.id&&!x.void)}
function alcFinal(a){let c=a,n;while((n=retestChild(c)))c=n;return c}

/* ---------- excel import ---------- */
const WORKER_FIELDS={company:['소속업체','협력사명','업체명','소속','업체','협력사','회사'],name:['성명','이름','근로자명'],job:['직종','공종','직책','직무'],gender:['성별'],birth:['생년월일','생일'],phone:['연락처','전화번호','휴대폰','핸드폰'],emergency:['비상연락처'],elderly:['고령근로자','고령자'],foreign:['외국인근로자','외국인'],blood:['혈액형'],helmet:['안전모번호','출입번호','안전모','사번'],inDate:['최초투입일','투입일','입사일','출근일'],hireY:['연도'],hireM:['=월'],hireD:['=일'],eduY:['기초안전보건교육이수'],eduN:['=미이수'],note:['비고']};
const EQUIP_FIELDS={no:['관리번호','번호'],company:['소속업체','업체명','소속','업체'],type:['장비명','장비종류','기종'],operator:['운전원','조종원','기사'],plate:['차량번호','등록번호'],phone:['운전원연락처','연락처','전화번호'],inDate:['반입일자','반입일'],outDate:['반출일자','반출일'],regCert:['건설기계등록증','등록증'],inspect:['검사기간','검사유효기간','검사일'],bizCert:['사업자등록증','사업자'],license:['운전원면허증','면허증','조종사면허'],moveIns:['동산보험'],insurance:['보험유효기간','보험기간','보험만료'],manager:['전담관리자','관리자'],checklist:['점검표'],note:['비고'],commander:['작업지휘자'],signal:['신호수','유도원']};

function buildMap(top,sub,FIELDS){
  const n=Math.max(top.length,sub?sub.length:0);const best={};
  for(let c=0;c<n;c++){
    const hd=norm((top[c]||'')+(sub?(sub[c]||''):''));if(!hd)continue;
    let bf=null,bl=0;
    for(const [f,al] of Object.entries(FIELDS))for(const a of al){const ex=a[0]==='=',na=norm(ex?a.slice(1):a),L=na.length;if((ex?hd===na:hd.includes(na))&&L>bl){bf=f;bl=L}}
    if(bf&&(!best[bf]||best[bf].l<bl))best[bf]={c,l:bl};
  }
  const m={};for(const k in best)m[k]=best[k].c;return m;
}
/* 빈 서식 행, 멀리 떨어진 낙서 셀(예: 1,048,537행의 'ㅋ')을 범위에서 제외 — 빈 행 500개 이상 이어지면 거기서 끝 */
function trimRef(ws){
  if(!ws['!ref'])return;const rs=new Set();let mc=0;
  for(const k in ws){if(k[0]==='!')continue;const c=ws[k];if(c.v===undefined||c.v===null||String(c.v).trim()==='')continue;const a=XLSX.utils.decode_cell(k);rs.add(a.r);if(a.c>mc)mc=a.c}
  const sorted=[...rs].sort((a,b)=>a-b);let mr=sorted[0]||0;
  for(const r of sorted){if(r-mr>500)break;mr=r}
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:mr,c:mc}});
}
function parseWorkbook(wb,FIELDS,minScore){
  let best=null;
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn];trimRef(ws);
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',blankrows:true});
    for(let r=0;r<Math.min(rows.length,20);r++){
      const m1=buildMap(rows[r],null,FIELDS),m2=buildMap(rows[r],rows[r+1]||[],FIELDS);
      const two=Object.keys(m2).length>Object.keys(m1).length;
      const map=two?m2:m1,sc=Object.keys(map).length;
      if(sc>=minScore&&(!best||sc>best.score))best={sn,rows,map,score:sc,start:r+(two?2:1)};
    }
  }
  if(!best)return null;
  if(best.map.hireY!=null&&best.map.hireM==null)best.map.hireM=best.map.hireY+1;
  if(best.map.hireM!=null&&best.map.hireD==null)best.map.hireD=best.map.hireM+1;
  const out=[];
  for(let r=best.start;r<best.rows.length;r++){const row=best.rows[r];const o={};
    for(const f in best.map)o[f]=String(row[best.map[f]]??'').trim();out.push(o)}
  return {sheet:best.sn,rows:out,fields:Object.keys(best.map)};
}
const readFile=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{try{res(XLSX.read(fr.result,{type:'array'}))}catch(e){rej(e)}};fr.onerror=()=>rej(fr.error);fr.readAsArrayBuffer(f)});
const eqKey=e=>(norm(e.plate)||norm(e.company)+'|'+norm(e.type))+'|'+norm(e.operator);
const wKey=w=>norm(w.name)+'|'+(norm(w.birth)||norm(w.company));

async function importFiles(kind,files,replace){
  if(kind==='vuln')return importVuln(files,replace);
  const isW=kind==='workers';const FIELDS=isW?WORKER_FIELDS:EQUIP_FIELDS;let added=0,updated=0,skipped=0;const msgs=[];const touched=new Set();
  const cur=replace?[]:[...(isW?W:E)];const idx=new Map(cur.map(x=>[isW?wKey(x):eqKey(x),x]));
  for(const f of files){
    let res;try{res=parseWorkbook(await readFile(f),FIELDS,isW?2:3)}catch(e){msgs.push(`${f.name}: 읽기 실패`);continue}
    if(!res){msgs.push(`${f.name}: 머리글(${isW?'성명/소속':'장비명/차량번호'}) 행을 찾지 못함`);continue}
    for(const o of res.rows){
      const valid=isW?!!o.name:!!(o.type||o.plate||o.operator);if(!valid){continue}
      if(isW&&/^(성명|이름)$/.test(o.name)){continue}
      if(isW){if(!o.inDate&&o.hireY&&o.hireM)o.inDate=`${o.hireY}-${pad(o.hireM)}-${pad(o.hireD||1)}`;if(o.eduY||o.eduN)o.eduBasic=o.eduY?'이수':'미이수';['hireY','hireM','hireD','eduY','eduN'].forEach(k=>delete o[k])}
      const k=isW?wKey(o):eqKey(o);const ex=idx.get(k);
      if(ex){for(const f2 in o)if(o[f2])ex[f2]=o[f2];ex.src=f.name;ex.updated=nowLocal();updated++;touched.add(ex.id)}
      else{const n={id:uid(),...o,src:f.name,created:nowLocal()};cur.push(n);idx.set(k,n);added++;touched.add(n.id)}
    }
    msgs.push(`${f.name} [${res.sheet}] 인식 완료`);
  }
  const store=isW?'workers':'equipment';
  if(SERVER)await pushImport(store,replace?cur:cur.filter(x=>touched.has(x.id)),replace);
  else{await DB.putMany(store,cur,replace);if(isW)W=cur;else E=cur}
  return {added,updated,skipped,msgs};
}

function weekSummary(from,to){
  const out=[];for(let ds=from;ds<=to;ds=addDays(ds,1)){
    const base=alcRowsOfDay(ds).filter(a=>!a.retestOf);const am=base.filter(a=>+a.at.slice(11,13)<12),pm=base.filter(a=>+a.at.slice(11,13)>=12);
    const c=l=>{const bad=l.filter(a=>isAlcBad(alcFinal(a))).length;return [l.length,l.length-bad,bad]};
    out.push({ds,am:c(am),pm:c(pm)})}
  return out;
}

function sigPad(host,label,preset){
  host.innerHTML=`<div class="sig"><div class="sig-h"><span>${h(label)}<small class="muted sig-auto" style="font-weight:500"></small></span><button type="button" class="btn sm ghost">지우기</button></div><canvas></canvas></div>`;
  const cv=$('canvas',host),ctx=cv.getContext('2d');let empty=true,drawing=false,last=null;
  const tag=t=>{$('.sig-auto',host).textContent=t?' · '+t:''};
  const drawImg=src=>{const im=new Image();im.onload=()=>{const r=cv.getBoundingClientRect();const sc=Math.min(r.width/im.width,r.height/im.height)*.9;const w=im.width*sc,hh=im.height*sc;ctx.drawImage(im,(r.width-w)/2,(r.height-hh)/2,w,hh);empty=false;tag('내 서명 자동 입력')};im.src=src};
  const setup=()=>{const r=cv.getBoundingClientRect();if(!r.width)return;const d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';empty=true;if(preset)drawImg(preset)};
  requestAnimationFrame(setup);
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener('pointerdown',e=>{if(!cv.width)setup();drawing=true;cv.setPointerCapture(e.pointerId);last=pos(e);ctx.beginPath();ctx.arc(last[0],last[1],1.2,0,7);ctx.fillStyle='#111';ctx.fill();empty=false;e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;e.preventDefault()});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>drawing=false));
  const clear=()=>{ctx.clearRect(0,0,cv.width,cv.height);empty=true;tag('')};
  $('button',host).onclick=clear;
  cv.addEventListener('pointerdown',()=>tag(''),{capture:true});
  return {isEmpty:()=>empty,data:()=>empty?'':cv.toDataURL('image/png'),clear,useMine:()=>{clear();if(S.mySig)drawImg(S.mySig)}};
}
function compressImg(file,max=1280,q=.72){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};

function comboHtml(id,kind,value,ph,attrs=''){

/* 각 장을 A4 한 장(인쇄 영역 190x277mm)에 맞게 자동 축소 */
async function printPages(pages){
  const P=$('#print');P.innerHTML=pages.map(p=>`<div class="pg">${p}</div>`).join('');
  P.style.cssText='display:block;position:absolute;left:-10000px;top:0;width:190mm';
  await Promise.all($$('img',P).map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  const mm=96/25.4,maxH=277*mm*0.97;
  $$('.pg',P).forEach(pg=>{pg.style.zoom='';const hgt=pg.scrollHeight;if(hgt>maxH)pg.style.zoom=(maxH/hgt).toFixed(3)});

}

/* ---------- 취약근로자 ---------- */
const VULN_FIELDS={no:['순번','번호'],name:['성명','이름'],company:['업체명','협력사명','소속업체','업체'],job:['공종명','공종','직종'],age:['연령','나이'],exam:['검진명','검진종류','유해인자'],grade:['건강구분1','건강구분'],finding:['검진소견1','검진소견'],follow1:['사후관리소견1','사후관리소견'],follow2:['사후관리소견2'],note:['비고']};
const compNorm=c=>norm(String(c||'').replace(/\((유|주)\)|㈜|주식회사|유한회사/g,''));
const vKey=p=>norm(p.name)+'|'+compNorm(p.company)+'|'+norm(p.job);
function vulnOf(name,company){const n=norm(name),c=compNorm(company);if(!n)return null;return VU.find(p=>!p.retired&&norm(p.name)===n&&(!c||!compNorm(p.company)||compNorm(p.company)===c))||null}
function vulnTags(p){const all=[...(p.items||[]).map(i=>[i.exam,i.finding,i.follow1,i.follow2,i.note].join(' ')),p.note||''].join(' ');const t=[];
  if(/혈압/.test(all))t.push('고혈압');if(/당뇨/.test(all))t.push('당뇨');if(/소음|난청/.test(all))t.push('소음성난청');if(/분진/.test(all))t.push('분진');
  if(+String(p.age).replace(/\D/g,'')>=S.vulnAge)t.push('고령');if((p.items||[]).some(i=>/^D/i.test(i.grade)))t.push('유소견(D)');
  if(/특검/.test(all))t.push('특검대상');if(/상담|진료|병원|치료/.test(all))t.push('상담·진료필요');return t}
const tagCls=t=>t==='유소견(D)'||t==='상담·진료필요'||t==='고혈압'?'bbad':'bwarn';
function vulnBadge(name,company){const p=vulnOf(name,company);return p?`<div class="badge bbad wrap" style="margin-top:6px"><i class="i i-heart"></i> 취약근로자 · ${vulnTags(p).join(' · ')||'관리대상'}</div>`:''}
function bpJudge(sy,di){if(!sy||!di)return '';if(sy>=S.bp.stop[0]||di>=S.bp.stop[1])return '위험';if(sy>=S.bp.warn[0]||di>=S.bp.warn[1])return '주의';return '정상'}
const bpCls=j=>({'정상':'bok','주의':'bwarn','위험':'bbad'}[j]||'bgray');
const isGenExam=i=>!i.exam||/^일반|혈압|당뇨|혈액|간기능/.test(i.exam);
const FIT=['가 (현재 조건에서 작업 가능)','나 (일정 조건하 작업 가능)','다 (한시적 작업 불가)','라 (영구적 작업 불가)'];
const CVD=['저위험','중등도위험','고위험','최고위험'];

async function importVuln(files,replace){
  let added=0,updated=0;const msgs=[];const cur=replace?[]:[...VU];const idx=new Map(cur.map(p=>[vKey(p),p]));const seen=new Set();
  for(const f of files){
    let wb;try{wb=await readFile(f)}catch(e){msgs.push(`${f.name}: 읽기 실패`);continue}let found=0;
    for(const sn of wb.SheetNames){
      const ws=wb.Sheets[sn];trimRef(ws);const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',blankrows:true});
      let hr=-1,map=null;for(let r=0;r<Math.min(rows.length,15);r++){const m=buildMap(rows[r],null,VULN_FIELDS);if(m.name!=null&&(m.exam!=null||m.finding!=null)){hr=r;map=m;break}}
      if(hr<0)continue;found++;let curP=null,skip=false,n=0;
      const g=(row,k)=>map[k]==null?'':String(row[map[k]]??'').replace(/\s*\n\s*/g,'').trim();
      for(let r=hr+1;r<rows.length;r++){const row=rows[r];const name=g(row,'name'),no=g(row,'no');
        if(name){
          if(/예시/.test(no)||/예시/.test(name)){skip=true;curP=null;continue}skip=false;
          const o={name,company:g(row,'company'),job:g(row,'job'),age:g(row,'age').replace(/\D/g,'')};const k=vKey(o);const ex=idx.get(k);
          if(ex){if(!seen.has(ex.id)){ex.items=[];updated++}Object.assign(ex,{company:o.company||ex.company,age:o.age||ex.age,src:f.name,updated:nowLocal()});curP=ex}
          else{curP={id:uid(),...o,items:[],consults:[],bp:[],src:f.name,created:nowLocal()};cur.push(curP);idx.set(k,curP);added++}
          seen.add(curP.id);n++;
        }else if(skip||!curP)continue;
        const it={exam:g(row,'exam'),grade:g(row,'grade'),finding:g(row,'finding'),follow1:g(row,'follow1'),follow2:g(row,'follow2'),note:g(row,'note')};
        if(Object.values(it).some(Boolean))curP.items.push(it);
      }
      msgs.push(`${f.name} [${sn}] ${n}명 인식`);
    }
    if(!found)msgs.push(`${f.name}: 머리글(성명/검진명) 행을 찾지 못함`);
  }
  cur.forEach(p=>{p.retired=!!p.retiredManual||(p.items||[]).some(i=>/퇴사/.test(i.note))});
  if(SERVER)await pushImport('vuln',replace?cur:cur.filter(p=>seen.has(p.id)),replace);
  else{await DB.putMany('vuln',cur,replace);VU=cur}
  return {added,updated,skipped:0,msgs};
}

  const wb=XLSX.utils.book_new();const hd=['순번','성명','업체명','공종명','연령','검진명','건강구분1','검진소견1','사후관리소견1','사후관리소견2','비고'];

  XLSX.utils.book_append_sheet(wb,sheet(aoa,[6,10,16,14,6,14,10,18,36,14,30],['A1:K1']),'목록');

function exportVuln(list){
  const hd=['순번','성명','업체명','공종명','연령','검진명','건강구분1','검진소견1','사후관리소견1','사후관리소견2','비고','분류','최근 사후상담','최근 혈압','상태'];const aoa=[['취약근로자 명단'],hd];const mg=['A1:O1'];
  list.forEach((p,i)=>{const its=p.items&&p.items.length?p.items:[{}];const c=(p.consults||[]).slice(-1)[0],b=(p.bp||[]).slice(-1)[0];
    its.forEach((it,j)=>aoa.push(j?['','','',p.job,'',it.exam,it.grade,it.finding,it.follow1,it.follow2,it.note]:[i+1,p.name,p.company,p.job,p.age,it.exam,it.grade,it.finding,it.follow1,it.follow2,it.note,vulnTags(p).join(', '),c?c.date:'미실시',b?`${b.sys}/${b.dia} ${b.judge}`:'',p.retired?'퇴사':'']))});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(aoa,[6,10,16,14,6,14,10,18,36,14,30,24,12,14,6],mg),'취약근로자');download(wb,`취약근로자 명단_${today()}.xlsx`);

async function api(path,body){

const kvGet=async k=>{const r=await DB.req(DB.st('kv','readonly').get(k));return r?r.v:undefined};

  if(!STORE[d.store])return false;
  const pend=await DB.req(DB.st('outbox','readonly').get(d.store+'|'+d.id));if(pend)return false; // 내 기기에 더 새 수정이 있음
  if(d.deleted){await DB.del(d.store,d.id);memDel(d.store,d.id)}else{const o={...d.data,id:d.id};await DB.put(d.store,o);memPut(d.store,o)}

function softRerender(){const ae=document.activeElement;if(!$('#modal').classList.contains('hidden')||(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))||$('canvas',V$()))return;R[cur]()}
const Sync={busy:false,again:false,t:null,state:'',
  soon(){clearTimeout(this.t);this.t=setTimeout(()=>this.run(),400)},
  async run(){if(!SERVER)return;if(this.busy){this.again=true;return}this.busy=true;let changed=false;
    try{const a=await this.push(),b=await this.pull();changed=a||b;this.state='ok'}
    catch(e){if(e.status===401){await kvSet('me',null);location.reload();return}this.state='off'}
    finally{this.busy=false;if(this.again){this.again=false;this.soon()}}
    if(changed)softRerender();badge()},
  async push(){const all=await DB.all('outbox');if(!all.length)return false;let i=0;
    while(i<all.length){const chunk=[];let size=0;while(i<all.length&&chunk.length<20){const n=JSON.stringify(all[i].data).length;if(chunk.length&&size+n>3e6)break;chunk.push(all[i]);size+=n;i++}
      const r=await api('docs',{docs:chunk.map(o=>({store:o.store,id:o.id,data:o.data}))});
      for(const o of chunk){const now=await DB.req(DB.st('outbox','readonly').get(o.k));if(now&&now.ts===o.ts)await DB.del('outbox',o.k)}
      for(const d of r.saved)await applyDoc(d)}
    return true},
  async pull(){let since=(await kvGet('lastSync'))||0,changed=false,more=true;
    while(more){const r=await api('sync?since='+since);for(const d of r.docs)if(await applyDoc(d))changed=true;since=r.cursor;more=r.more}
    await kvSet('lastSync',since);return changed}
};

async function pushImport(store,docs,replace){
  if(!navigator.onLine)throw new Error('대장 업로드는 인터넷 연결이 필요합니다');
  for(let i=0;i===0||i<docs.length;i+=200){
    const r=await api('docs',{import:true,replaceStores:replace&&i===0?[store]:[],docs:docs.slice(i,i+200).map(o=>({store,id:o.id,data:o}))});

  await Sync.run()}

/* 주간 일일점검표 (A4 1장 / 장비 1대) */
function docEqWeek(e,mon){
  const days=[0,1,2,3,4,5].map(i=>addDays(mon,i)),cs=days.map(d=>eqCheckOf(e.id,d));
  const titles=[...eqItems().map(i=>i.t)];cs.forEach(c=>c&&c.items.forEach(it=>{if(!titles.includes(it.t))titles.push(it.t)}));
  const desc=Object.fromEntries(eqItems().map(i=>[i.t,i.d]));
  const cell=(c,t)=>{if(!c)return '';const it=c.items.find(x=>x.t===t);return it?(it.v==='O'?'○':it.v==='X'?'<b>×</b>':'-'):''};
  const notes=t=>cs.map((c,i)=>{const it=c&&c.items.find(x=>x.t===t);return it&&it.note?`${WD6[i]}: ${h(it.note)}`:''}).filter(Boolean).join('<br>');
  const last=[...cs].reverse().find(c=>c&&c.sig);
  const remarks=cs.map((c,i)=>c&&c.remark?`${WD6[i]}(${md(days[i])}) ${h(c.remark)}`:'').filter(Boolean);
  return `<div class="doc eqw"><h1>장비 전담관리자 일일점검표</h1><div class="site">[ ${h(S.site||'현장명')} ] · ${weekLabel(mon)} (${md(days[0])}~${md(days[5])})</div>
  <table><tr><th>소속협력사</th><td colspan="3">${h(e.company||'')}</td></tr>
  <tr><th>장비종류</th><td>${h(e.type||'')}</td><th>장비번호</th><td>${h(e.plate||'')}</td></tr>
  <tr><th>장비 전담관리자</th><td>${h(e.manager||'')}</td><th>(서명)</th><td style="text-align:center">${last?`<img class="sigimg" src="${last.sig}">`:''}</td></tr></table>
  <table class="grid6"><tr><th class="it">점 검 항 목</th>${days.map((d,i)=>`<th>${WD6[i]}<br>(${md(d)})</th>`).join('')}<th class="rm">비 고</th></tr>
  ${titles.map((t,i)=>`<tr><td class="it">${i+1}. ${h(t)}${desc[t]?`<div class="dsc">${h(desc[t])}</div>`:''}</td>${cs.map(c=>`<td class="mk">${cell(c,t)}</td>`).join('')}<td class="rm">${notes(t)}</td></tr>`).join('')}
  <tr><td class="it">점검자</td>${cs.map(c=>`<td class="mk sm">${c?h(c.inspector||''):''}</td>`).join('')}<td class="rm"></td></tr></table>
  ${remarks.length?`<div class="sec">비고</div><div class="note">${remarks.join('<br>')}</div>`:''}
  <p style="font-size:9pt">○ 양호 · × 불량(비고에 조치사항) · - 해당없음 · 빈칸 미점검</p></div>`;
}

/* 사진대지: 장비별로 기간 내 사진을 4장씩 묶어 한 건으로 */
function eqPhotoBlocks(list,from,to,label){
  const out=[];
  for(const e of list){
    const wk=EC.filter(c=>c.kind==='weekPhoto'&&c.equipId===e.id&&!c.void&&c.week>=weekMon(from)&&c.week<=to).sort((a,b)=>a.week.localeCompare(b.week));
    const cs=EC.filter(c=>c.kind!=='weekPhoto'&&c.equipId===e.id&&!c.void&&c.date>=from&&c.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
    const ph=[...wk.flatMap(c=>(c.photos||[]).map(p=>({...p,date:c.week}))),...cs.flatMap(c=>(c.photos||[]).map(p=>({...p,date:c.date})))];
    for(let i=0;i<ph.length;i+=4){const g=ph.slice(i,i+4);const caps=[...new Set(g.map(p=>p.cap).filter(Boolean))];
      out.push({date:label||g[0].date,content:eqName(e)+(caps.length?' — '+caps.join(' / '):''),photos:g.map(p=>p.src)})}
  }
  return out;
}
function docPhotoSheet(blocks){
  const pages=[];
  for(let i=0;i<blocks.length;i+=2){
    const two=blocks.slice(i,i+2);
    pages.push(`<div class="doc psheet"><h1>사 진 대 지</h1><div class="pl">현장명 : ${h(S.site||'')}</div>
    ${two.map(b=>`<div class="pblock"><div class="pgrid n${b.photos.length}">${b.photos.map(s=>`<div><img src="${s}"></div>`).join('')}${b.photos.length===3?'<div></div>':''}</div>
      <table><tr><th>일 시</th><td>${h(b.date)}</td><th>내 용</th><td>${h(b.content)}</td></tr></table></div>`).join('')}
    ${two.length===1?'<div class="pblock empty">이하 여백</div>':''}</div>`);
  }
  return pages;
}

  let v='home';try{v=sessionStorage.getItem('v')||'home'}catch(e){}go(R[v]?v:'home');
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    /* 새 버전 자동 적용: 열 때·다시 볼 때 확인. 입력 중이면 끊지 않고 상단에 '업데이트' 버튼만 띄움 */
    const hadCtl=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      const chk=()=>reg.update().catch(()=>{});chk();
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});
    }).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(!hadCtl)return;
      const busy=!$('#modal').classList.contains('hidden')||(cur!=='home'&&$('canvas',V$()));

    });
  }
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
